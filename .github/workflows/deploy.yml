name: Build & Deploy site (GH Pages mirror + Cloudflare Pages canonical)

# 單一 build → 組裝四路徑 → 雙 publish（避免 CF 與 GH 各 build 一次造成設定漂移）。
# - build：建 Astro brand+blog，並組裝 /resume/（resume repo）與 /film-brain/（film-brain repo site/）
#          兩子站皆為 VitePress、base 已對（/resume/、/film-brain/），直接 copy 進 dist 子目錄。
# - deploy-gh-pages：GitHub Pages（過渡期 canonical，CF 上線後為 mirror）；獨立 job，不依賴 CF
# - deploy-cloudflare：Cloudflare Pages（目標 canonical）；僅在 CLOUDFLARE_API_TOKEN secret 存在時執行
#
# 組裝為自足式（main CI 直接 checkout+build 公開子 repo，免跨 repo artifact auth）。
# resume 的 PDF/projects 資料已 commit 進 repo，故 resume 只需 npm build（免 Typst）。
# 子站更新自動重組：resume/film-brain 的 CI 成功後可 repository_dispatch(type: assemble-site)
# 觸發本 workflow（需在該子 repo 設 PAT；未設時用 workflow_dispatch 手動重組）。

on:
  push:
    branches: [master, main]
  workflow_dispatch:
  repository_dispatch:
    types: [assemble-site, webmention]
  # Webmention 排程重建(P2-11):站外迴響是 build 時抓的,不重建就不會出現。
  # 每 6 小時重建一次,讓新的回覆/喜歡最遲半天內上站。
  # 為何不用 webhook 即時:webmention.io 的 webhook 只能 POST 一個 URL、無法帶
  # Authorization header,而 GitHub 的 repository_dispatch 需要 PAT 認證,兩者接不上。
  # 要即時就得加一層代理(如 Cloudflare Worker 持有 PAT → 呼叫 repository_dispatch,
  # 對應上方的 webmention dispatch type);個人站的迴響延遲半天可接受,故先用排程。
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # --- 主站 Astro brand+blog ---
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Astro (brand + blog)
        run: npm run build
        # PUBLIC_* 為公開值（會進 client HTML）；用 repo Variables 注入。
        # 未設 → 空字串 → 元件 gating 自動略過（留言/analytics 不輸出）。
        env:
          PUBLIC_GISCUS_REPO: ${{ vars.PUBLIC_GISCUS_REPO }}
          PUBLIC_GISCUS_REPO_ID: ${{ vars.PUBLIC_GISCUS_REPO_ID }}
          PUBLIC_GISCUS_CATEGORY: ${{ vars.PUBLIC_GISCUS_CATEGORY }}
          PUBLIC_GISCUS_CATEGORY_ID: ${{ vars.PUBLIC_GISCUS_CATEGORY_ID }}
          PUBLIC_CF_BEACON_TOKEN: ${{ vars.PUBLIC_CF_BEACON_TOKEN }}
          PUBLIC_WEBMENTION_DOMAIN: ${{ vars.PUBLIC_WEBMENTION_DOMAIN }}

      # --- 組裝 /resume/（jimc1682000/resume，VitePress base /resume/）---
      - name: Checkout resume repo
        uses: actions/checkout@v4
        with:
          repository: jimc1682000/resume
          path: _src/resume
      - name: Build resume (PDF/projects 資料已 commit，免 Typst)
        working-directory: _src/resume
        run: |
          npm ci
          npm run build
      - name: Assemble resume → dist/resume
        run: |
          mkdir -p dist/resume
          cp -R _src/resume/docs/.vitepress/dist/. dist/resume/

      # --- 組裝 /film-brain/（jimc1682000/film-brain，site/ 下 VitePress base /film-brain/）---
      - name: Checkout film-brain repo
        uses: actions/checkout@v4
        with:
          repository: jimc1682000/film-brain
          path: _src/film-brain
      - name: Build film-brain (site/ VitePress)
        working-directory: _src/film-brain/site
        run: |
          npm ci
          npx vitepress build docs
      - name: Assemble film-brain → dist/film-brain
        run: |
          mkdir -p dist/film-brain
          cp -R _src/film-brain/site/docs/.vitepress/dist/. dist/film-brain/

      # --- 產出 artifact（去掉子 repo checkout 目錄，避免混入）---
      - name: Verify assembled paths
        run: |
          test -f dist/index.html
          test -f dist/blog/index.html
          test -f dist/resume/index.html
          test -f dist/film-brain/index.html
          echo "assembled OK: / /blog/ /resume/ /film-brain/"
      # GitHub Pages 專用 artifact（供 deploy-pages 使用）
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # 一般 artifact（供 Cloudflare 部署 job 下載，維持單一 build）
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          retention-days: 1

  deploy-gh-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-cloudflare:
    needs: build
    runs-on: ubuntu-latest
    # 僅當設有 Cloudflare token 時才跑（needs-human 前自動略過，不拖垮 GH mirror）
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Skip notice
        if: env.HAS_CF != 'true'
        run: echo "CLOUDFLARE_API_TOKEN 未設定，略過 Cloudflare 部署（needs-human）。"
      - uses: actions/download-artifact@v4
        if: env.HAS_CF == 'true'
        with:
          name: site-dist
          path: dist
      - name: Deploy to Cloudflare Pages
        if: env.HAS_CF == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=jimmychen
