name: Build & Deploy site (GH Pages mirror + Cloudflare Pages canonical)

# 單一 build → 組裝 → 雙 publish（避免 CF 與 GH 各 build 一次造成設定漂移）。
# - build：建 Astro brand+blog+L0 /resume/，並組裝 /film-brain/（film-brain repo site/）
# - 完整履歷不再從 jimc1682000/resume 組進公開 dist（見 docs/hidden-resume.md）
# - deploy-gh-pages：GitHub Pages mirror；獨立 job，不依賴 CF
# - deploy-cloudflare：Cloudflare Pages canonical；僅在 CLOUDFLARE_API_TOKEN secret 存在時執行
#
# film-brain 組裝為自足式（checkout 公開子 repo）。
# 子站更新可 repository_dispatch(type: assemble-site) 觸發重組。

on:
  push:
    branches: [master, main]
  workflow_dispatch:
  repository_dispatch:
    types: [assemble-site, webmention]
  # Webmention 排程檢查(P2-11):站外迴響是 build 時抓的,不重建就不會出現。
  # 每 6 小時「先查再決定」——由 gate job 比對 webmention.io 的最新 wm-id 與上次快取，
  # 每天另做一次 full build，收斂 max-id 看不到的更新與刪除。
  # 為何不用 webhook 即時:webmention.io 的 webhook 只能 POST 一個 URL、無法帶
  # Authorization header,而 GitHub 的 repository_dispatch 需要 PAT 認證,兩者接不上;
  # 要即時就得多一層 Cloudflare Worker 持有 PAT(對應上方 webmention dispatch type)。
  # 「排程 + 先查」用一個唯讀 token 就換到同樣的低浪費,不必引入可寫 repo 的 PAT。
  schedule:
    - cron: '0 */6 * * *'
    - cron: '17 1 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 排程觸發時先查有沒有新迴響，沒有就不 build（省掉每天 4 次白 build）。
  # 非排程觸發（push / 手動 / 子站 dispatch）一律直接 build，不受此 gate 影響。
  gate:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      latest: ${{ steps.decide.outputs.latest }}
    steps:
      - name: Restore last seen webmention id
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: wm-state
          key: webmention-state-
          restore-keys: webmention-state-

      - name: Decide whether to build
        id: decide
        env:
          WM_DOMAIN: ${{ vars.PUBLIC_WEBMENTION_DOMAIN }}
          WM_TOKEN: ${{ secrets.WEBMENTION_IO_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "非排程觸發（${{ github.event_name }}）→ 直接 build。"
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ github.event.schedule }}" = "17 1 * * *" ]; then
            echo "每日 full refresh → 直接 build。"
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # 排程觸發：只為刷新站外迴響而跑。查不到就跳過，下次 cron 再試。
          if [ -z "${WM_DOMAIN:-}" ] || [ -z "${WM_TOKEN:-}" ]; then
            echo "PUBLIC_WEBMENTION_DOMAIN 或 WEBMENTION_IO_TOKEN 未設 → 無迴響可刷新，跳過。"
            echo "build=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # 變更訊號取「全網域最大 wm-id」：wm-id 單調遞增，且用 max 就不必依賴
          # 排序參數是否被支援（比取第 1 筆穩）。刪除迴響不會改變 max，可接受。
          body=$(curl -sS --max-time 20 -G 'https://webmention.io/api/mentions.jf2' \
            --data-urlencode "domain=${WM_DOMAIN}" \
            --data-urlencode "token=${WM_TOKEN}" \
            --data-urlencode 'per-page=200') || {
              echo "查詢 webmention.io 失敗 → 跳過本次，下個 cron 再試。"
              echo "build=false" >> "$GITHUB_OUTPUT"; exit 0
            }
          latest=$(printf '%s' "$body" | jq -r '[.children[]?["wm-id"]] | max // 0' 2>/dev/null || echo '')
          if [ -z "$latest" ] || [ "$latest" = "null" ]; then
            echo "回應無法解析（可能 token 無效或格式變動）→ 跳過本次，下個 cron 再試。"
            echo "build=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          prev=$(cat wm-state 2>/dev/null || echo 'init')
          echo "最新 wm-id=$latest；上次記錄=$prev"
          if [ "$latest" = "$prev" ]; then
            echo "無新迴響 → 不 build。"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "有新迴響 → build。"
            echo "latest=$latest" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      # --- 主站 Astro brand+blog ---
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Astro (brand + blog)
        run: npm run build
        # PUBLIC_* 為公開值（會進 client HTML）；OPENAI_API_KEY 只供 build-time moderation。
        # 未設 Giscus → 不輸出 GitHub tab；未設 OpenAI → moderation fail-open。
        env:
          PUBLIC_GISCUS_REPO: ${{ vars.PUBLIC_GISCUS_REPO }}
          PUBLIC_GISCUS_REPO_ID: ${{ vars.PUBLIC_GISCUS_REPO_ID }}
          PUBLIC_GISCUS_CATEGORY: ${{ vars.PUBLIC_GISCUS_CATEGORY }}
          PUBLIC_GISCUS_CATEGORY_ID: ${{ vars.PUBLIC_GISCUS_CATEGORY_ID }}
          PUBLIC_WEBMENTION_DOMAIN: ${{ vars.PUBLIC_WEBMENTION_DOMAIN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} # gitleaks:allow

      # --- /resume/ 由主站 Astro 產出 L0（不再 checkout 完整履歷 repo）---

      # --- 組裝 /film-brain/（jimc1682000/film-brain，site/ 下 VitePress base /film-brain/）---
      - name: Checkout film-brain repo
        uses: actions/checkout@v4
        with:
          repository: jimc1682000/film-brain
          path: _src/film-brain
      - name: Build film-brain (site/ VitePress)
        working-directory: _src/film-brain/site
        run: |
          npm ci
          npx vitepress build docs
      - name: Assemble film-brain → dist/film-brain
        run: |
          mkdir -p dist/film-brain
          cp -R _src/film-brain/site/docs/.vitepress/dist/. dist/film-brain/

      # --- 產出 artifact（去掉子 repo checkout 目錄，避免混入）---
      - name: Verify assembled paths
        run: |
          test -f dist/index.html
          test -f dist/blog/index.html
          test -f dist/resume/index.html
          test -f dist/en/resume/index.html
          test -f dist/film-brain/index.html
          # 完整履歷 PDF 不得再進公開 dist
          if find dist -type f -name 'resume-*.pdf' | grep -q .; then
            echo 'ERROR: resume PDF found in public dist' >&2
            find dist -type f -name 'resume-*.pdf' >&2
            exit 1
          fi
          echo "assembled OK: / /blog/ /resume/(L0) /en/resume/(L0) /film-brain/"
      # GitHub Pages 專用 artifact（供 deploy-pages 使用）
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 1
      # 一般 artifact（供 Cloudflare 部署 job 下載，維持單一 build）
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          retention-days: 1

  deploy-gh-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-cloudflare:
    needs: build
    runs-on: ubuntu-latest
    # 僅當設有 Cloudflare token 時才跑（needs-human 前自動略過，不拖垮 GH mirror）
    # 舊 deployment 清理在 purge-cloudflare-deployments（不擋 send-webmentions）
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Skip notice
        if: env.HAS_CF != 'true'
        run: echo "CLOUDFLARE_API_TOKEN 未設定，略過 Cloudflare 部署（needs-human）。"
      - uses: actions/download-artifact@v4
        if: env.HAS_CF == 'true'
        with:
          name: site-dist
          path: dist
      - name: Deploy to Cloudflare Pages
        if: env.HAS_CF == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=jimmychen --branch=${{ github.event.repository.default_branch }} --commit-hash=${{ github.sha }}

  # 清舊 deployment 與正式 deploy 拆開：purge 失敗不應擋住 send-webmentions
  # （canonical 已上線，出站 webmention / Bridgy Fed 仍要送）。
  purge-cloudflare-deployments:
    needs: deploy-cloudflare
    runs-on: ubuntu-latest
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      PURGE_OLD_CF_DEPLOYMENTS: ${{ vars.PURGE_OLD_CF_DEPLOYMENTS }}
    steps:
      - name: Skip notice
        if: env.HAS_CF != 'true' || env.PURGE_OLD_CF_DEPLOYMENTS != 'true'
        run: echo "Cloudflare deployment purge: skipped"
      - uses: actions/checkout@v4
        if: env.HAS_CF == 'true' && env.PURGE_OLD_CF_DEPLOYMENTS == 'true'
        with:
          sparse-checkout: scripts
      - name: Delete old Cloudflare Pages deployments
        if: env.HAS_CF == 'true' && env.PURGE_OLD_CF_DEPLOYMENTS == 'true'
        run: node scripts/purge-cloudflare-pages-deployments.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: jimmychen
          CLOUDFLARE_KEEP_COMMIT_SHA: ${{ github.sha }}

  # 只有排程觸發、且真的因新迴響而重建並部署成功後，才把 wm-id 記進快取。
  # 必須等 canonical（CF）與 mirror（GH）都成功：只記 GH 成功會讓六小時 gate 以為已上線，
  # CF 失敗時就不再重試直到每日 full refresh。
  record-webmention-state:
    needs: [gate, deploy-gh-pages, deploy-cloudflare]
    if: github.event_name == 'schedule' && github.event.schedule != '17 1 * * *' && needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Write last seen webmention id
        run: echo '${{ needs.gate.outputs.latest }}' > wm-state
      - uses: actions/cache/save@v4
        with:
          path: wm-state
          key: webmention-state-${{ github.run_id }}

  # 發送 webmention（P2-13）：對文章正文裡的外部連結通知對方。
  # 必須在 deploy 之後跑：接收端會回頭抓 source URL 驗證連結是否真的存在，
  # 部署前送出會驗證失敗。
  # 只在 push（內容變更）時跑；排程與子站 dispatch 不需要重送。
  send-webmentions:
    needs: [build, deploy-cloudflare]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist
      # 已送過的 (source, target) 記在快取，避免每次部署都重送
      - uses: actions/cache/restore@v4
        with:
          path: .webmention-sent.json
          key: webmention-sent-
          restore-keys: webmention-sent-
      - name: Send webmentions
        # 探索不到端點／對方掛掉都不該讓部署變紅
        continue-on-error: true
        run: node scripts/send-webmentions.mjs --dist dist --site https://jimmychen.me
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .webmention-sent.json
          key: webmention-sent-${{ github.run_id }}
